<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeMind - AI Video Summarizer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f0f2f5;
            color: #333;
        }

        /* Layout */
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .auth-box {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        /* Inputs & Buttons */
        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button.secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        button.danger {
            background: #dc3545;
            width: auto;
            font-size: 14px;
            padding: 8px 15px;
        }

        /* Utils */
        .hidden {
            display: none !important;
        }

        .error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            cursor: pointer;
            opacity: 0.6;
        }

        /* Sections */
        .admin-panel {
            border: 2px solid #dc3545;
            background: #fff5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #007bff;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            background: #f9fbff;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9em;
            background: #eee;
        }

        /* Summary Box */
        #summary-box {
            background: #eef7ff;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #007bff;
            display: none;
            margin-top: 20px;
        }

        #summary-text h1,
        #summary-text h2 {
            color: #0056b3;
            margin-top: 15px;
        }

        #summary-text ul {
            padding-left: 20px;
        }

        /* Admin Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9em;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* --- NEW CHAT STYLES --- */
        .chat-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        /* The Scrollable Window */
        #chat-window {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* Message Bubbles */
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95em;
            position: relative;
            word-wrap: break-word;
        }

        /* User (Right Side, Blue) */
        .message.user {
            align-self: flex-end;
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        /* AI (Left Side, Grey) */
        .message.ai {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        /* Markdown inside AI bubbles */
        .message.ai p {
            margin: 0 0 10px 0;
        }

        .message.ai p:last-child {
            margin: 0;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div id="auth-screen" class="container auth-box">
        <h1 style="color: #007bff;">🧠 TubeMind</h1>
        <p>Login to start analyzing videos.</p>
        <div id="login-form">
            <input type="text" id="username" placeholder="Username">
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Password">
                <img src="/static/eye_c.png" id="toggle-login" class="password-toggle"
                    onclick="togglePassword('password', 'toggle-login')">
            </div>
            <button onclick="login()">Log In</button>
            <button class="secondary" onclick="toggleAuth('register')">Create Account</button>
        </div>
        <div id="register-form" class="hidden">
            <input type="text" id="reg-username" placeholder="Choose Username">
            <div class="password-wrapper">
                <input type="password" id="reg-password" placeholder="Choose Password">
                <img src="/static/eye_c.png" id="toggle-reg" class="password-toggle"
                    onclick="togglePassword('reg-password', 'toggle-reg')">
            </div>
            <button onclick="register()">Sign Up</button>
            <button class="secondary" onclick="toggleAuth('login')">Back to Login</button>
        </div>
        <p id="auth-error" class="error"></p>
    </div>

    <div id="dashboard-screen" class="container">
        <div class="header">
            <h2>🚀 TubeMind Dashboard</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="user-display" style="font-weight: bold; color: #555;"></span>
                <button onclick="logout()"
                    style="background: #333; width: auto; font-size: 14px; padding: 8px 15px;">Logout</button>
            </div>
        </div>

        <div id="my-videos-section" style="margin-bottom: 20px;">
            <h3>📂 My Videos</h3>
            <div id="video-list" style="display: grid; gap: 10px; max-height: 200px; overflow-y: auto;"></div>
        </div>

        <div id="admin-section" class="admin-panel hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: #dc3545; margin: 0;">🛡️ Admin Controls</h3>
                <button class="danger" onclick="clearSystem()">⚠️ Factory Reset</button>
            </div>
            <h4>User Database</h4>
            <div style="overflow-x: auto;">
                <table id="user-table">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Username</th>
                            <th>IP</th>
                            <th>Age</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body"></tbody>
                </table>
            </div>
        </div>

        <div class="upload-area">
            <h3>1. Upload Video</h3>
            <p style="color: #666; margin-bottom: 15px;">Supports MP4, AVI, MOV (Max 500MB)</p>
            <input type="file" id="videoInput" accept="video/*" style="max-width: 300px;">
            <button onclick="uploadVideo()" style="max-width: 200px; margin-top: 10px;">Upload & Process</button>
            <div id="upload-status" style="margin-top: 15px; font-weight: bold;"></div>
        </div>

        <div id="summary-box">
            <h3>2. AI Summary</h3>
            <div id="summary-text" style="line-height: 1.6;"></div>
        </div>

        <div class="chat-section">
            <h3>3. Chat with Video</h3>

            <div id="chat-window">
                <div style="text-align: center; color: #aaa; margin-top: 150px;">
                    <i>Select a video to start chatting</i>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="chatInput" rows="1" placeholder="Ask something... (Shift+Enter for new line)"></textarea>
                <button onclick="sendChat()" style="width: 100px; height: 50px;">Ask</button>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('access_token');
        let currentVideoId = null;

        // --- PASSWORD TOGGLE ---
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") { input.type = "text"; icon.src = "/static/eye_o.png"; }
            else { input.type = "password"; icon.src = "/static/eye_c.png"; }
        }

        // --- AUTH LOGIC ---
        function toggleAuth(mode) {
            document.getElementById('login-form').classList.toggle('hidden', mode === 'register');
            document.getElementById('register-form').classList.toggle('hidden', mode === 'login');
            document.getElementById('auth-error').innerText = "";
        }

        // Event Listeners
        document.getElementById("password").addEventListener("keypress", (e) => { if (e.key === "Enter") { e.preventDefault(); login(); } });
        const chatBox = document.getElementById("chatInput");
        chatBox.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });
        chatBox.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });

        if (token) showDashboard();

        async function register() {
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const formData = new FormData(); formData.append('username', user); formData.append('password', pass);
            const res = await fetch(`http://127.0.0.1:8000/register`, { method: 'POST', body: formData });
            if (res.ok) { alert("Registered! Please log in."); toggleAuth('login'); }
            else { const data = await res.json(); document.getElementById('auth-error').innerText = data.detail; }
        }

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const params = new URLSearchParams(); params.append('username', user); params.append('password', pass);
            const res = await fetch('http://127.0.0.1:8000/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('username', user);
                location.reload();
            } else { document.getElementById('auth-error').innerText = "Invalid credentials"; }
        }
        function logout() { localStorage.clear(); location.reload(); }

        function showDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            document.getElementById('user-display').innerText = `👤 ${localStorage.getItem('username')}`;
            if (localStorage.getItem('user_role') === 'admin') document.getElementById('admin-section').classList.remove('hidden');
            fetchMyVideos();
            if (localStorage.getItem('user_role') === 'admin') fetchUsers();
        }

        // --- VIDEO & CHAT LOGIC ---

        async function fetchMyVideos() {
            const res = await fetch('http://127.0.0.1:8000/my_videos', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
                const videos = await res.json();
                const container = document.getElementById('video-list');
                container.innerHTML = videos.length ? '' : '<p style="color:#777;">No videos uploaded yet.</p>';
                videos.forEach(vid => {
                    let color = vid.status === 'COMPLETED' ? '#28a745' : (vid.status.includes('FAILED') ? '#dc3545' : '#ffc107');
                    const viewBtn = vid.status === 'COMPLETED' ? `<button onclick="loadVideo(${vid.id})" style="padding: 5px 10px; font-size: 0.8em; width: auto;">View</button>` : '';
                    container.innerHTML += `
                        <div style="display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 6px; border-left: 4px solid ${color};">
                            <div><strong>${vid.filename}</strong> <span style="font-size: 0.8em; color: #555; margin-left: 10px;">${vid.status}</span></div>
                            <div style="display:flex; gap:10px;">${viewBtn}<button onclick="deleteVideo(${vid.id})" style="background: #dc3545; padding: 5px 10px; font-size: 0.8em; width: auto;">🗑️</button></div>
                        </div>`;
                });
            }
        }

        async function loadVideo(id) {
            currentVideoId = id;
            document.getElementById('summary-box').style.display = 'block';
            document.getElementById('summary-text').innerText = "Loading summary...";

            // 1. Fetch Summary
            const res = await fetch(`http://127.0.0.1:8000/video/${id}`, { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('summary-text').innerHTML = marked.parse(data.summary);
                document.getElementById('upload-status').innerHTML = '<span class="status-badge" style="background:#d4edda; color:#155724">Loaded from History</span>';
                document.getElementById('summary-box').scrollIntoView({ behavior: 'smooth' });
            }

            // 2. Fetch Chat History (NEW)
            loadChatHistory(id);
        }

        async function loadChatHistory(videoId) {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '<div style="text-align:center; color:#888;">Loading chat history...</div>';

            try {
                const res = await fetch(`http://127.0.0.1:8000/chat_history/${videoId}`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    const history = await res.json();
                    chatWindow.innerHTML = ''; // Clear loading msg

                    if (history.length === 0) {
                        chatWindow.innerHTML = '<div style="text-align:center; color:#ccc; margin-top:150px;">No chat history yet. Ask a question!</div>';
                    } else {
                        history.forEach(msg => {
                            appendMessage(msg.is_user ? 'user' : 'ai', msg.text);
                        });
                    }
                    chatWindow.scrollTop = chatWindow.scrollHeight; // Scroll to bottom
                }
            } catch (e) {
                console.error("Chat load error", e);
                chatWindow.innerHTML = '<div style="text-align:center; color:red;">Failed to load chat history.</div>';
            }
        }

        function appendMessage(role, text) {
            const chatWindow = document.getElementById('chat-window');
            // Remove placeholders
            if (chatWindow.innerHTML.includes('No chat history') || chatWindow.innerHTML.includes('Select a video') || chatWindow.innerHTML.includes('Loading chat')) {
                chatWindow.innerHTML = '';
            }

            const bubble = document.createElement('div');
            bubble.className = `message ${role}`;

            if (role === 'ai') {
                bubble.innerHTML = marked.parse(text); // Render Markdown for AI
            } else {
                bubble.innerText = text; // Plain text for User
            }

            chatWindow.appendChild(bubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendChat() {
            const inputField = document.getElementById('chatInput');
            const query = inputField.value.trim();
            if (!query || !currentVideoId) return;

            // 1. Show User Message immediately
            appendMessage('user', query);

            // 2. Clear Input
            inputField.value = '';

            // 3. Show "Thinking" Bubble
            const chatWindow = document.getElementById('chat-window');
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'message ai';
            loadingBubble.id = 'temp-loading';
            loadingBubble.innerHTML = '<i>🤔 Thinking...</i>';
            chatWindow.appendChild(loadingBubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // 4. Send to Backend
            try {
                const res = await fetch(`http://127.0.0.1:8000/chat/${currentVideoId}?query=${encodeURIComponent(query)}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                // Remove Loading Bubble
                const loader = document.getElementById('temp-loading');
                if (loader) loader.remove();

                if (res.ok) {
                    const data = await res.json();
                    appendMessage('ai', data.answer);
                } else {
                    appendMessage('ai', '⚠️ Error: Could not get response.');
                }
            } catch (e) {
                const loader = document.getElementById('temp-loading');
                if (loader) loader.remove();
                appendMessage('ai', '⚠️ Connection failed.');
            }
        }

        // --- UPLOAD & ADMIN ---

        async function uploadVideo() {
            const file = document.getElementById('videoInput').files[0];
            if (!file) return alert("Please select a file!");
            const formData = new FormData(); formData.append("file", file);
            document.getElementById('upload-status').innerHTML = '<span class="status-badge">Uploading...</span>';
            const res = await fetch('http://127.0.0.1:8000/upload/', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData });
            if (res.ok) {
                const data = await res.json();
                currentVideoId = data.video_id;
                document.getElementById('upload-status').innerHTML = `<span class="status-badge">Processing ID: ${currentVideoId}</span>`;
                pollStatus();
            } else { alert("Upload failed."); }
        }

        async function pollStatus() {
            const interval = setInterval(async () => {
                const res = await fetch(`http://127.0.0.1:8000/video/${currentVideoId}`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    const data = await res.json();
                    if (data.status === "COMPLETED") {
                        clearInterval(interval);
                        document.getElementById('upload-status').innerHTML = `<span class="status-badge" style="background:#d4edda; color:#155724">✅ Done!</span><button onclick="deleteVideo(${currentVideoId})" style="background: #dc3545; font-size: 0.8em; padding: 5px 10px; width: auto; margin-left: 10px;">🗑️ Delete</button>`;
                        document.getElementById('summary-box').style.display = "block";
                        document.getElementById('summary-text').innerHTML = marked.parse(data.summary);
                    } else if (data.status.includes("FAILED")) {
                        clearInterval(interval);
                        document.getElementById('upload-status').innerHTML = '<span class="status-badge" style="background:#f8d7da; color:#721c24">❌ Failed</span>';
                    } else {
                        // Queue Logic
                        let statusMsg = "⏳ Processing...";
                        if (data.status === "PENDING") {
                            statusMsg = data.queue_position !== undefined ? `⏳ In Queue (Position: #${data.queue_position})` : "⏳ Pending in Queue...";
                        } else if (data.status.includes("PROCESSING")) {
                            statusMsg = `⚙️ AI Working... (${data.status})`;
                        }
                        document.getElementById('upload-status').innerText = statusMsg;
                    }
                }
            }, 2000);
        }

        async function fetchUsers() {
            const res = await fetch('http://127.0.0.1:8000/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
                const users = await res.json();
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';
                users.forEach(user => {
                    const isSelf = user.username === localStorage.getItem('username');
                    const deleteBtn = isSelf ? '' : `<button onclick="deleteUser('${user.id}')" style="background:none; border:none; cursor:pointer; font-size:1.2em;" title="Delete User">⛔</button>`;
                    tbody.innerHTML += `<tr><td style="font-family: monospace; font-size: 0.8em;">${user.id}</td><td><b>${user.username}</b> ${user.role === 'admin' ? '🛡️' : ''}</td><td>${user.ip}</td><td>${user.account_age}</td><td style="text-align:center;">${deleteBtn}</td></tr>`;
                });
            }
        }

        async function deleteUser(userId) {
            if (!confirm("Are you sure you want to BAN and DELETE this user?")) return;
            const res = await fetch(`http://127.0.0.1:8000/admin/user/${userId}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) { alert("User deleted."); fetchUsers(); } else { const data = await res.json(); alert("Error: " + data.detail); }
        }

        async function deleteVideo(vidId) {
            if (!confirm("Delete this video permanently?")) return;
            const res = await fetch(`http://127.0.0.1:8000/video/${vidId}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) { alert("Video deleted!"); location.reload(); }
        }

        async function clearSystem() {
            if (!confirm("⚠️ ADMIN ACTION\nAre you sure you want to delete ALL data?")) return;
            const res = await fetch('http://127.0.0.1:8000/clear_data', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            alert(data.status || data.error);
            location.reload();
        }
    </script>
</body>

</html>
